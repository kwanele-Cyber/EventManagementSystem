<!-- ReturnEquipment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Equipment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <h1>Return Equipment</h1>

        <form method="post" action="/Inventory/Return">
            <div>
                <label for="InventoryItem">Equipment:</label>
                <select id="InventoryItem" name="InventoryId">
                    <!-- Options populated from backend -->
                </select>
            </div>
            <div>
                <label for="ConditionUponReturn">Condition Upon Return:</label>
                <textarea id="ConditionUponReturn" name="ConditionUponReturn"></textarea>
            </div>
            <button type="submit">Submit Return</button>
        </form>
    </div>
</body>
</html>
