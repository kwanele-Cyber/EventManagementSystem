<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspect Returned Equipment</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            min-width: 300px;
            max-width: 800px;
            width: 75%;
            margin: 20px;
            padding: 30px;
            box-shadow: 5px 5px 30px #1d253a;
            border-radius: 10px;
            background: #ffffff;
        }

        h1,
        h2 {
            text-align: center;
        }

        /* Tab Navigation */
        .tab-container {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #4CAF50;
            margin-bottom: 20px;
        }

        .tab {
            cursor: pointer;
            padding: 10px 20px;
            margin-right: 5px;
            background: #e0e0e0;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .tab.active {
            background: #4CAF50;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        button:hover {
            background-color: #45a049;
        }

        #fileDamageReport {
            display: none;
            /* Hide initially */
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .error {
            color: red;
            font-size: 0.9em;
            display: none;
        }

        .item-row {
            margin-bottom: 15px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        .remove-item {
            color: red;
            cursor: pointer;
            float: right;
        }

        .signiture-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin-top: 20px;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-top: 20px;
        }

        canvas {
            border: 1px solid #ccc;
            width: 100%;
            height: 150px;
        }
    </style>
</head>

<body>
    <h1>Inspect Returned Equipment</h1>
    <div class="wrapper">
        <div class="tab-container">
            <div class="tab active" data-tab="inspectionDetails">Inspection Details</div>
            <div class="tab" data-tab="damageReport">Damage Report</div>
            <div class="tab" data-tab="signatures">Signatures</div>
        </div>

        <form id="inspectionForm">
            <div class="tab-content active" id="inspectionDetails">
                <div id="itemsContainer"></div>
                <button type="button" id="addItemButton">Add Equipment Item</button>
                <button type="button" id="submitInspection">Submit Inspection</button>
            </div>

            <div class="tab-content" id="damageReport">
                <div id="fileDamageReport" style="display:none;">
                    <h2>Compiled Damage Report</h2>
                    <table id="damageReportTable">
                        <thead>
                            <tr>
                                <th>Equipment Name</th>
                                <th>Damaged Quantity</th>
                                <th>Missing Quantity</th>
                                <th>Repair Cost per Item ($)</th>
                                <th>Total Cost ($)</th>
                            </tr>
                        </thead>
                        <tbody id="damageReportBody"></tbody>
                        <tfoot>
                            <tr>
                                <td colspan="4"><strong>Total Amount to Pay ($):</strong></td>
                                <td id="totalAmountToPay">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="tab-content" id="signatures">
                <h3>Signatures</h3>
                <div class="signiture-container">
                    <div class="canvas-container">
                        <label for="signature1">Inspector</label>
                        <canvas id="signature1"></canvas>
                    </div>
                    <div class="canvas-container">
                        <label for="signature2">Event Organiser</label>
                        <canvas id="signature2"></canvas>
                    </div>
                </div>
                <button id="clearSignatures">Clear Signatures</button>
            </div>
        </form>
    </div>

    <script>
        const inventory = [
            { id: 1, name: "Chairs", repairCost: 20 },
            { id: 2, name: "Tables", repairCost: 50 },
            // Add more items as necessary
        ];

        document.getElementById("addItemButton").addEventListener("click", addItemRow);
        document.getElementById("submitInspection").addEventListener("click", handleSubmit);
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => showTab(tab.dataset.tab));
        });

        function showTab(tabName) {
            document.querySelectorAll(".tab").forEach(tab => {
                tab.classList.remove("active");
            });
            document.querySelectorAll(".tab-content").forEach(content => {
                content.classList.remove("active");
            });

            document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add("active");
            document.getElementById(tabName).classList.add("active");
        }

        function addItemRow() {
            const container = document.getElementById("itemsContainer");
            const itemRow = document.createElement("div");
            itemRow.classList.add("item-row");

            const select = document.createElement("select");
            select.classList.add("itemSelect");
            select.required = true;
            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Select Equipment";
            select.appendChild(defaultOption);

            inventory.forEach(item => {
                const option = document.createElement("option");
                option.value = item.id;
                option.textContent = item.name;
                select.appendChild(option);
            });

            const damagedInput = document.createElement("input");
            damagedInput.type = "number";
            damagedInput.placeholder = "Damaged Items";
            damagedInput.value = "0";
            damagedInput.min = "0";
            damagedInput.classList.add("damagedInput");
            damagedInput.required = true;

            const missingInput = document.createElement("input");
            missingInput.type = "number";
            missingInput.placeholder = "Missing Items";
            missingInput.value = "0";
            missingInput.min = "0";
            missingInput.classList.add("missingInput");
            missingInput.required = true;

            // Update total cost and the damage report when quantity changes
            damagedInput.addEventListener("input", updateDamageReport);
            missingInput.addEventListener("input", updateDamageReport);
            select.addEventListener("change", updateDamageReport);

            const removeButton = document.createElement("span");
            removeButton.textContent = "Remove";
            removeButton.classList.add("remove-item");
            removeButton.addEventListener("click", () => {
                container.removeChild(itemRow);
                updateDamageReport();
            });

            itemRow.appendChild(select);
            itemRow.appendChild(damagedInput);
            itemRow.appendChild(missingInput);
            itemRow.appendChild(removeButton);
            container.appendChild(itemRow);
        }

        function updateDamageReport() {
            const itemRows = document.querySelectorAll(".item-row");
            const damageReportBody = document.getElementById("damageReportBody");
            damageReportBody.innerHTML = ""; // Clear previous entries
            let totalAmount = 0;

            itemRows.forEach(row => {
                const select = row.querySelector(".itemSelect");
                const damagedInput = row.querySelector(".damagedInput");
                const missingInput = row.querySelector(".missingInput");

                const damagedQuantity = parseInt(damagedInput.value) || 0;
                const missingQuantity = parseInt(missingInput.value) || 0;
                const selectedItemId = select.value;

                if (selectedItemId) {
                    const selectedItem = inventory.find(item => item.id == selectedItemId);
                    const repairCost = selectedItem.repairCost;
                    const totalCost = (damagedQuantity + missingQuantity) * repairCost;

                    const rowElement = document.createElement("tr");
                    rowElement.innerHTML = `
                        <td>${selectedItem.name}</td>
                        <td>${damagedQuantity}</td>
                        <td>${missingQuantity}</td>
                        <td>${repairCost.toFixed(2)}</td>
                        <td>${totalCost.toFixed(2)}</td>
                    `;
                    damageReportBody.appendChild(rowElement);
                    totalAmount += totalCost;
                }
            });

            document.getElementById("totalAmountToPay").textContent = totalAmount.toFixed(2);
            document.getElementById("fileDamageReport").style.display = totalAmount > 0 ? "block" : "none";
        }

        function handleSubmit() {
            // Validate and process form submission here
            const items = [];
            const itemRows = document.querySelectorAll(".item-row");

            itemRows.forEach(row => {
                const select = row.querySelector(".itemSelect");
                const damagedInput = row.querySelector(".damagedInput");
                const missingInput = row.querySelector(".missingInput");

                items.push({
                    equipmentId: select.value,
                    damaged: damagedInput.value,
                    missing: missingInput.value
                });
            });

            console.log("Submitted Items:", items);
            alert("Inspection submitted successfully!");
            // Reset the form or handle submission logic as necessary
        }

        let isDrawing = false;
        let currentCanvas = null;
        let context = null;

        // Set up canvas event listeners
        document.querySelectorAll("canvas").forEach(canvas => {
            canvas.addEventListener("mousedown", startDrawing);
            canvas.addEventListener("mouseup", stopDrawing);
            canvas.addEventListener("mousemove", draw);
            canvas.addEventListener("mouseleave", stopDrawing);
        });

        // Start drawing when mouse is pressed
        function startDrawing(event) {
            isDrawing = true;
            currentCanvas = event.target;
            context = currentCanvas.getContext("2d");
            context.beginPath();
            context.moveTo(event.offsetX, event.offsetY);
        }

        // Stop drawing when mouse is released or leaves the canvas
        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                context.closePath(); // Close the current path
            }
        }

        // Handle drawing on the canvas
        function draw(event) {
            if (!isDrawing) return; // Don't draw if not currently drawing
            context.lineTo(event.offsetX, event.offsetY);
            context.strokeStyle = "#000";
            context.lineWidth = 2;
            context.stroke();
        }

        // Clear the specific canvas
        function clearCanvas(canvas) {
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Add event listener to clear signatures button
        document.getElementById("clearSignatures").addEventListener("click", (e) => {
            e.preventDefault();
            clearAllSignatures();
        });

        // Clear all canvas signatures
        function clearAllSignatures() {
            document.querySelectorAll("canvas").forEach(canvas => {
                clearCanvas(canvas);
            });
        }

        // If you want to add click to clear for each canvas, uncomment this:
        document.querySelectorAll("canvas").forEach(canvas => {
            canvas.addEventListener("click", (event) => {
                // Optional: Clear canvas on click
                // clearCanvas(canvas);
            });
        });



    </script>
</body>

</html>
