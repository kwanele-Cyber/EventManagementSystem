<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damage Reports with Inspections</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tfoot {
            background-color: #e0e0e0;
        }

        button {
            padding: 10px 15px;
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #fileDamageReport {
            display: none;
            margin-top: 20px;
        }

        .damage-report-section {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    
    <!-- Hidden Damage Report Section -->
    <div id="fileDamageReport">
        <h2>Compiled Damage Report</h2>

        <!-- Displaying Event Information -->
        <p><strong>Event ID:</strong> <span id="eventId"></span></p>
        <p><strong>Inspector ID:</strong> <span id="inspectorId"></span></p>
        <p><strong>Event Organiser:</strong> <span id="eventOrganiser"></span></p>

        <!-- Table for displaying inspection details -->
        <div class="damage-report-section">
            <h3>Inspections</h3>
            <table id="damageReportTable">
                <thead>
                    <tr>
                        <th>Inventory ID</th>
                        <th>Damaged Quantity</th>
                        <th>Missing Quantity</th>
                        <th>Repair Cost per Item ($)</th>
                        <th>Replacement Cost per Item ($)</th>
                        <th>Total Cost ($)</th>
                    </tr>
                </thead>
                <tbody id="damageReportBody"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="5"><strong>Total Amount to Pay ($):</strong></td>
                        <td id="totalAmountToPay">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <button>Back</button>
    </div>

    <script>
        // Sample data representing a damage report with a list of inspections
        const damageReport = {
            eventId: 123,
            inspectorId: 'INS-456',
            eventOrganiser: 'John Doe',
            inspections: [
                { inventoryId: 101, damagedQty: 2, missingQty: 1, repairCost: 120, replacementCost: 80 },
                { inventoryId: 102, damagedQty: 1, missingQty: 0, repairCost: 250, replacementCost: 0 },
                { inventoryId: 103, damagedQty: 3, missingQty: 1, repairCost: 300, replacementCost: 150 },
                { inventoryId: 104, damagedQty: 1, missingQty: 0, repairCost: 180, replacementCost: 0 }
            ]
        };

        // Function to populate the damage report table and display event information
        function populateDamageReport() {
            const damageReportBody = document.getElementById("damageReportBody");
            let totalAmountToPay = 0;

            // Clear existing rows
            damageReportBody.innerHTML = '';

            // Display event details
            document.getElementById("eventId").textContent = damageReport.eventId;
            document.getElementById("inspectorId").textContent = damageReport.inspectorId;
            document.getElementById("eventOrganiser").textContent = damageReport.eventOrganiser;

            // Populate rows based on the inspection data
            damageReport.inspections.forEach(report => {
                const totalCost = (report.damagedQty * report.repairCost) + (report.missingQty * report.replacementCost);
                totalAmountToPay += totalCost;

                const row = `
                <tr>
                    <td>${report.inventoryId}</td>
                    <td>${report.damagedQty}</td>
                    <td>${report.missingQty}</td>
                    <td>${report.repairCost.toFixed(2)}</td>
                    <td>${report.replacementCost.toFixed(2)}</td>
                    <td>${totalCost.toFixed(2)}</td>
                </tr>
            `;
                damageReportBody.insertAdjacentHTML('beforeend', row);
            });

            // Update total amount to pay
            document.getElementById("totalAmountToPay").textContent = totalAmountToPay.toFixed(2);
        }

        // Populate the report with data
        populateDamageReport();
        // Show the damage report section
        document.getElementById("fileDamageReport").style.display = 'block';
    </script>

</body>

</html>
